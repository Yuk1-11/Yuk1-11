<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f6f8fa" />
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d0d7de" opacity="0.7" />
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#heroGrad)" stroke="#d0d7de" stroke-width="1.5" />
  <rect x="640" y="1" width="559" height="318" rx="15" fill="url(#dotGrid)" opacity="0.55" />

  <!-- Architectural Network Topology Graphic on Right -->
  <g opacity="0.9">
    <path d="M740 85 L880 55 L1030 110 L1115 72" stroke="#d0d7de" stroke-width="1.5" />
    <path d="M740 85 L830 175 L985 190 L1030 110" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.65" />
    <path d="M830 175 L765 252 L935 262 L985 190 L1110 238" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.5" />
    <path d="M880 55 L830 175" stroke="#d0d7de" stroke-width="1.2" stroke-dasharray="4 4" />
    <path d="M985 190 L1115 72" stroke="#d0d7de" stroke-width="1.2" stroke-dasharray="4 4" />

    <circle cx="740" cy="85" r="6" fill="#f6f8fa" stroke="#10b981" stroke-width="2.5" />
    <circle cx="880" cy="55" r="5" fill="#f6f8fa" stroke="#656d76" stroke-width="2" />
    <circle cx="1030" cy="110" r="8" fill="#10b9811a" stroke="#10b981" stroke-width="2.5" />
    <circle cx="1115" cy="72" r="5" fill="#f6f8fa" stroke="#3b82f6" stroke-width="2" />
    <circle cx="830" cy="175" r="9" fill="#10b9811a" stroke="#3b82f6" stroke-width="2.5" />
    <circle cx="985" cy="190" r="7" fill="#f6f8fa" stroke="#10b981" stroke-width="2.5" />
    <circle cx="765" cy="252" r="5" fill="#f6f8fa" stroke="#656d76" stroke-width="2" />
    <circle cx="935" cy="262" r="6" fill="#f6f8fa" stroke="#3b82f6" stroke-width="2" />
    <circle cx="1110" cy="238" r="5" fill="#f6f8fa" stroke="#656d76" stroke-width="2" />

    <!-- Right-side miniature card annotation -->
    <rect x="855" y="135" width="170" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de" />
    <text x="871" y="158" fill="#1f2328" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">@yuki-tabata</text>
  </g>

  <!-- Left Typography Block -->
  <rect x="56" y="54" width="72" height="4" rx="2" fill="url(#accentBar)" />
  <text x="56" y="88" fill="#656d76" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="1.2">CYBERSECURITY ENTHUSIAST · SOFTWARE DEVELOPER</text>
  <text x="56" y="152" fill="#1f2328" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="54" font-weight="700" letter-spacing="-1.2">Yuki Tabata</text>
  <text x="56" y="192" fill="#656d76" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18">Second-year high school student building secure software, cloud systems, and embedded tools.</text>

  <!-- Bottom 3 Domain Metrics Strip -->
  <line x1="56" y1="230" x2="660" y2="230" stroke="#d0d7de" stroke-width="1" />
  <text x="56" y="258" fill="#656d76" font-family="system-ui, -apple-system, sans-serif" font-size="12">SECURITY</text>
  <text x="56" y="280" fill="#1f2328" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">InfoSec &amp; AI Safety</text>

  <text x="260" y="258" fill="#656d76" font-family="system-ui, -apple-system, sans-serif" font-size="12">CLOUD</text>
  <text x="260" y="280" fill="#1f2328" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">AWS ACA &amp; Firebase</text>

  <text x="464" y="258" fill="#656d76" font-family="system-ui, -apple-system, sans-serif" font-size="12">SYSTEMS</text>
  <text x="464" y="280" fill="#1f2328" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">C++ · Rust · WebAssembly</text>
</svg>